<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Model-driven app test page</title></head>
<body>
<!-- A model-driven form as far as the field steps read it: a shown field renders a container with its logical name as
     data-id, a hidden one has a control and an attribute in Xrm.Page but nothing in the DOM. -->
<div data-id="name"><label>Name</label><input value="Contoso Tower"></div>
<div data-id="talxis_preferredchannels"><label>Preferred channels</label></div>
<div data-id="talxis_note"><label>Note</label><textarea></textarea></div>
<div data-id="talxis_number"><label>Number</label><input value="C0001" readonly></div>
<div data-id="talxis_number-locked-iconWrapper"></div>

<!-- A form section, the main grid (its records are in the app's grid state, see getCurrentXrmStatus) and the toggle of the
     new look, which is on. -->
<section data-id="details_section"></section>
<div data-id="data-set-body-container"></div>
<button class="ms-Toggle-background" aria-checked="true"></button>

<!-- A subgrid whose command bar shows a command enabled and one disabled (greyed out by its enable rule). -->
<div id="dataSetRoot_Contacts">
  <ul data-id="Contacts-CommandBar">
    <li><button aria-label="Add Contact"><span>Add Contact</span></button></li>
    <li><button aria-label="Deactivate" aria-disabled="true"><span>Deactivate</span></button></li>
  </ul>
</div>

<!-- A form command bar as a model-driven app renders it: a command is a button with its label in a span (its aria-label
     is the label, an empty line and the command's description). A command with
     sub commands has aria-haspopup; a moment after it is clicked, its flyout opens in the Fluent portal mount node, as a
     div whose id is the id of the command's list item with '_flyout' (clicking the command again closes it). A split
     button has a button that runs its command and an unlabelled one that opens its flyout. Commands that do not fit are
     in the More commands flyout. The page records the command it runs in the body's data-clicked attribute. -->
<ul data-lp-id="commandbar-Form:account">
  <li id="account|Form|Flows_button1"><button role="menuitem" aria-label="Run Flow&#10;&#10;Run a flow on the record." aria-haspopup="true" aria-expanded="false"><span>Flow</span></button></li>
  <li id="account|Form|Connect1_splitButton"><button role="menuitem" aria-label="Connect&#10;&#10;Connect the record to another."><span>Connect</span></button></li>
  <li id="account|Form|Connect$splitButtonId_button1"><button role="menuitem" aria-label="Connect&#10;&#10;Connect the record to another." aria-haspopup="true" aria-expanded="false"></button></li>
  <li id="OverflowButton_button1"><button role="menuitem" data-id="OverflowButton" aria-label="More commands for Account" aria-haspopup="true" aria-expanded="false"></button></li>
</ul>
<div id="__fluentPortalMountNode"></div>

<!-- Text behind the dialogs, a dialog and a dialog opened from it (topmost, later in the page). -->
<p>Summary</p>
<div role="dialog"><h1>Wizard</h1><p>Step 1</p><button title="Next">Next</button></div>
<div role="dialog"><h1>Confirm</h1><p>Leave the wizard?</p><button title="Leave">Leave</button></div>

<script>
  // The commands of the flyouts, by the id of the list item of the command that opens them. 'My flow' is in two flyouts.
  const flyouts = {
    'account|Form|Flows_button1': [
      { item: 'account|Form|Flows.RunFlow_button1', label: 'Run a flow', opens: true },
      { item: 'account|Form|Flows.MyFlow0', label: 'My flow' },
    ],
    'account|Form|Flows.RunFlow_button1': [{ item: 'account|Form|Flows.RunFlow.MyFlow0', label: 'My flow', runs: 'Run a flow > My flow' }],
    'account|Form|Connect$splitButtonId_button1': [{ item: 'account|Form|Connect.ToAnother0', label: 'To Another Person' }],
    'OverflowButton_button1': [
      { item: 'account|Form|Refresh0', label: 'Refresh' },
      { item: 'account|Form|WordTemplate_button1', label: 'Word Templates', opens: true },
    ],
    'account|Form|WordTemplate_button1': [{ item: 'account|Form|WordTemplate.Invoice0', label: 'Invoice' }],
  };

  function openFlyout(item) {
    const flyout = document.createElement('div');
    flyout.id = item + '_flyout';
    const menu = document.createElement('ul');
    menu.setAttribute('role', 'menu');
    menu.dataset.id = item === 'OverflowButton_button1' ? 'OverflowFlyout' : item;
    for (const command of flyouts[item]) {
      const listItem = document.createElement('li');
      listItem.id = command.item;
      const button = document.createElement('button');
      button.setAttribute('role', 'menuitem');
      button.setAttribute('aria-label', command.label);
      if (command.opens) {
        button.setAttribute('aria-haspopup', 'true');
        button.setAttribute('aria-expanded', 'false');
      }
      button.dataset.runs = command.runs || command.label;
      const label = document.createElement('span');
      label.textContent = command.label;
      button.append(label);
      listItem.append(button);
      menu.append(listItem);
    }
    flyout.append(menu);
    document.getElementById('__fluentPortalMountNode').append(flyout);
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('ul[data-lp-id] button, #__fluentPortalMountNode button');
    if (!button) {
      return;
    }

    if (button.getAttribute('aria-haspopup') !== 'true') {
      document.body.dataset.clicked = button.dataset.runs || button.textContent;
      return;
    }

    const item = button.closest('li').id;
    const open = document.getElementById(item + '_flyout');
    button.setAttribute('aria-expanded', open ? 'false' : 'true');
    if (open) {
      open.remove();
    } else {
      setTimeout(() => openFlyout(item), 300);
    }
  });

  function attribute(name, value) { return { getName: () => name, getValue: () => value }; }
  function control(label, attribute) { return { getLabel: () => label, getAttribute: () => attribute }; }

  const attributes = {
    name: attribute('name', 'Contoso Tower'),
    talxis_preferredchannels: attribute('talxis_preferredchannels', []),
    talxis_note: attribute('talxis_note', ''),
    talxis_number: attribute('talxis_number', 'C0001'),
    talxis_emailfrequency: attribute('talxis_emailfrequency', null),
    talxis_phonefrequency: attribute('talxis_phonefrequency', 100000001),
  };

  const controls = [
    control('Name', attributes.name),
    control('Preferred channels', attributes.talxis_preferredchannels),
    control('Note', attributes.talxis_note),
    control('Number', attributes.talxis_number),
    control('Email frequency', attributes.talxis_emailfrequency),
    control('Phone frequency', attributes.talxis_phonefrequency),
    // A subgrid's control has a label but no attribute.
    { getLabel: () => 'Documents' },
  ];

  window.Xrm = {
    Page: {
      getAttribute: name => attributes[name] || null,
      ui: { controls: { get: matches => controls.filter(matches) } },
    },
  };

  // The records of the main grid by their ids, in the app's grid state.
  window.getCurrentXrmStatus = () => ({
    mainGrid: {
      _grid: {
        getRows: () => ({ _collection: { 'a1b2c3d4-0000-0000-0000-000000000001': {}, 'a1b2c3d4-0000-0000-0000-000000000002': {} } }),
      },
    },
  });

  // The rows of the Contacts subgrid: a contact without an account and one of the first account.
  function contact(account) {
    const attributes = [attribute('fullname', 'A contact'), attribute('parentcustomerid', account ? [{ id: account, entityType: 'account' }] : null)];
    return { getData: () => ({ getEntity: () => ({ attributes: { get: () => attributes } }) }) };
  }

  const contacts = [contact(null), contact('{A1B2C3D4-0000-0000-0000-000000000001}')];
  window.Xrm.Page.getControl = name => name === 'Contacts' ? { getGrid: () => ({ getRows: () => ({ get: () => contacts }) }) } : null;
</script>
</body>
</html>
