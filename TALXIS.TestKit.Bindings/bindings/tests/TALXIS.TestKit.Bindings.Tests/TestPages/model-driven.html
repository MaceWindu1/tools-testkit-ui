<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Model-driven app test page</title></head>
<body>
<!-- A model-driven form as far as the field steps read it: a shown field renders a container with its logical name as
     data-id, a hidden one has a control and an attribute in Xrm.Page but nothing in the DOM. -->
<div data-id="name"><label>Name</label><input value="Contoso Tower"></div>
<div data-id="talxis_preferredchannels"><label>Preferred channels</label></div>
<div data-id="talxis_note"><label>Note</label><textarea></textarea></div>
<div data-id="talxis_number"><label>Number</label><input value="C0001" readonly></div>
<div data-id="talxis_number-locked-iconWrapper"></div>

<!-- A form section, the main grid (its records are in the app's grid state, see getCurrentXrmStatus) and the toggle of the
     new look, which is on. -->
<section data-id="details_section"></section>
<div data-id="data-set-body-container"></div>
<button class="ms-Toggle-background" aria-checked="true"></button>

<!-- A subgrid whose command bar shows a command enabled and one disabled (greyed out by its enable rule). -->
<div id="dataSetRoot_Contacts">
  <ul data-id="Contacts-CommandBar">
    <li><button aria-label="Add Contact"><span>Add Contact</span></button></li>
    <li><button aria-label="Deactivate" aria-disabled="true"><span>Deactivate</span></button></li>
  </ul>
</div>

<!-- Text behind the dialogs, a dialog and a dialog opened from it (topmost, later in the page). -->
<p>Summary</p>
<div role="dialog"><h1>Wizard</h1><p>Step 1</p><button title="Next">Next</button></div>
<div role="dialog"><h1>Confirm</h1><p>Leave the wizard?</p><button title="Leave">Leave</button></div>

<script>
  function attribute(name, value) { return { getName: () => name, getValue: () => value }; }
  function control(label, attribute) { return { getLabel: () => label, getAttribute: () => attribute }; }

  const attributes = {
    name: attribute('name', 'Contoso Tower'),
    talxis_preferredchannels: attribute('talxis_preferredchannels', []),
    talxis_note: attribute('talxis_note', ''),
    talxis_number: attribute('talxis_number', 'C0001'),
    talxis_emailfrequency: attribute('talxis_emailfrequency', null),
    talxis_phonefrequency: attribute('talxis_phonefrequency', 100000001),
  };

  const controls = [
    control('Name', attributes.name),
    control('Preferred channels', attributes.talxis_preferredchannels),
    control('Note', attributes.talxis_note),
    control('Number', attributes.talxis_number),
    control('Email frequency', attributes.talxis_emailfrequency),
    control('Phone frequency', attributes.talxis_phonefrequency),
    // A subgrid's control has a label but no attribute.
    { getLabel: () => 'Documents' },
  ];

  window.Xrm = {
    Page: {
      getAttribute: name => attributes[name] || null,
      ui: { controls: { get: matches => controls.filter(matches) } },
    },
  };

  // The records of the main grid by their ids, in the app's grid state.
  window.getCurrentXrmStatus = () => ({
    mainGrid: {
      _grid: {
        getRows: () => ({ _collection: { 'a1b2c3d4-0000-0000-0000-000000000001': {}, 'a1b2c3d4-0000-0000-0000-000000000002': {} } }),
      },
    },
  });

  // The rows of the Contacts subgrid: a contact without an account and one of the first account.
  function contact(account) {
    const attributes = [attribute('fullname', 'A contact'), attribute('parentcustomerid', account ? [{ id: account, entityType: 'account' }] : null)];
    return { getData: () => ({ getEntity: () => ({ attributes: { get: () => attributes } }) }) };
  }

  const contacts = [contact(null), contact('{A1B2C3D4-0000-0000-0000-000000000001}')];
  window.Xrm.Page.getControl = name => name === 'Contacts' ? { getGrid: () => ({ getRows: () => ({ get: () => contacts }) }) } : null;
</script>
</body>
</html>
